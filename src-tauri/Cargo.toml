[package]
name = "adhd-focus"
version = "0.2.0"
description = "ADHD Focus desktop shell"
edition = "2021"

[lib]
name = "adhd_focus"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
